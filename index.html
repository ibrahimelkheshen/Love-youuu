<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اعتذار لـ صودتي ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #333;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(10px);
            max-width: 420px;
            width: 100%;
            position: relative;
        }
        .avatar {
            font-size: 70px;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }
        .avatar:hover {
            transform: scale(1.2) rotate(10deg);
        }
        h1 {
            color: #e63946;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            font-size: 17px;
            line-height: 1.6;
            color: #4a4a4a;
            margin-bottom: 20px;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            margin-top: 15px;
        }
        .btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: 0.3s;
            width: 80%;
        }
        .btn:hover {
            background: #ff6b81;
            transform: translateY(-2px);
        }
        .btn-run {
            background: #747d8c;
            box-shadow: none;
            position: relative;
        }
        #secret-msg {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff0f3;
            border: 2px dashed #ff4757;
            border-radius: 15px;
            color: #d63031;
            font-weight: bold;
            font-size: 16px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
        }
        .floating-heart {
            position: absolute;
            font-size: 24px;
            animation: floatUp 4s linear infinite;
            opacity: 0.8;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="hearts-container" id="hearts-bg"></div>

    <div class="card">
        <div class="avatar" id="bear" onclick="hugBear()">🥺</div>
        <h1>حقك عليا يا صودتي ❤️</h1>
        <p>عارف إن الفترة اللي فاتت حصلت مشاكل وغصب عني والله.. بس إنتي عارفة إنك غالية عندي قد ايه وماقدرش على زعلك يا صودتي حقك عليا ومتشيليش هم اللي جاي كله!</p>
        
        <div class="btn-container">
            <button class="btn" onclick="forgive()">سامحتك يا هيمو خلاص 🙈</button>
            <button class="btn btn-run" id="runBtn" onmouseover="moveBtn()" onclick="moveBtn()">لسه زعلانة ومفيش أمل 😜</button>
        </div>

        <div id="secret-msg">
            وعد مني يا صودتي، اللي جاي كله هيبقى أحسن وأجمل بكتير، وهنعوض كل لحظة زعل سوا.. بحبك وبموت فيكي يا كل حاجة لي! ✨👑
        </div>
    </div>

    <script>
        // إطلاق القلوب في الخلفية
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = ['❤️', '💖', '🌸', '✨', '💕'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.getElementById('hearts-bg').appendChild(heart);

            setTimeout(() => { heart.remove(); }, 4000);
        }
        setInterval(createHeart, 400);

        // حركة الزرار الراهب
        function moveBtn() {
            const btn = document.getElementById('runBtn');
            const x = Math.random() * (window.innerWidth - 150) - (window.innerWidth / 2 - 75);
            const y = Math.random() * (window.innerHeight - 100) - (window.innerHeight / 2 - 50);
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        // التسامح والبهجة
        function forgive() {
            document.getElementById('secret-msg').style.display = 'block';
            document.getElementById('bear').innerText = '🥰';
            document.getElementById('runBtn').style.display = 'none';
            
            for(let i = 0; i < 30; i++) {
                setTimeout(createHeart, i * 50);
            }
        }

        // تفاعل عند الضغط على الدبدوب
        function hugBear() {
            const bear = document.getElementById('bear');
            bear.innerText = '💖';
            setTimeout(() => { bear.innerText = '🥺'; }, 1000);
        }
    </script>
</body>
</html>
